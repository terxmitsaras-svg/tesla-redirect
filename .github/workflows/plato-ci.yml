name: PLATO CI

on:
  push:
    paths: ["plato/**", ".github/workflows/plato-ci.yml"]
  pull_request:
    paths: ["plato/**", ".github/workflows/plato-ci.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plato/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plato/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plato/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
