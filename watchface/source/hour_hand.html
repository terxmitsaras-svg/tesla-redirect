<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:transparent;} svg{display:block;}</style>
</head>
<body>
<!-- HOUR HAND — left arm, "come forth" pointing gesture. Canvas 100x156. Pivot = (50,141). Points up (12:00 rest). -->
<svg width="100" height="156" viewBox="0 0 100 156" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#12233f"/>
    <stop offset="45%" stop-color="#2f5382"/>
    <stop offset="100%" stop-color="#16294a"/>
  </linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#a9754e"/>
    <stop offset="50%" stop-color="#cf9a6e"/>
    <stop offset="100%" stop-color="#a9754e"/>
  </linearGradient>
</defs>

<!-- tail / counterweight under the pivot -->
<path d="M38,156 C36,148 36,142 50,141 C64,142 64,148 62,156 Z" fill="url(#sleeve)"/>

<!-- sleeve, tapering up from the pivot to the wrist -->
<path d="M14,145 C10,120 16,88 30,62 C34,54 40,48 50,46
         C60,48 62,56 58,66 C48,90 44,120 46,145 Z" fill="url(#sleeve)"/>
<path d="M20,120 C18,100 22,80 30,64" stroke="#0e1c33" stroke-width="3" fill="none" opacity="0.5"/>
<path d="M40,110 C38,92 42,70 50,52" stroke="#3c5f8f" stroke-width="2.4" fill="none" opacity="0.55"/>

<!-- gold cuff -->
<path d="M40,58 C44,50 56,50 60,58 C56,64 44,64 40,58 Z" fill="#e3bd6a"/>

<!-- forearm + hand, pointing gesture -->
<path d="M42,58 C40,46 41,34 45,24 L55,24 C58,34 58,46 56,58 Z" fill="url(#skin)"/>
<!-- extended index finger pointing to 12 -->
<path d="M46,26 C45,16 45,8 47,1 C48,-1 52,-1 53,1 C55,8 55,16 54,26 Z" fill="url(#skin)"/>
<!-- curled fingers -->
<path d="M42,27 C38,26 35,23 35,19 C35,16 38,15 40,17 C41,20 42,24 42,27 Z" fill="#c48f61"/>
<path d="M56,27 C60,26 62,22 61,19 C60,16 57,16 56,19 C55,22 55,25 56,27 Z" fill="#c48f61"/>
<!-- thumb -->
<path d="M43,32 C38,32 34,35 34,39 C34,42 37,43 40,41 C43,39 44,35 43,32 Z" fill="#c48f61"/>
</svg>
</body></html>
