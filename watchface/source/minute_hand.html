<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:transparent;} svg{display:block;}</style>
</head>
<body>
<!-- MINUTE HAND — right arm, blessing gesture. Canvas 90x211. Pivot = (45,191). Points up (12:00 rest). -->
<svg width="90" height="211" viewBox="0 0 90 211" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="sleeveM" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#12233f"/>
    <stop offset="45%" stop-color="#2f5382"/>
    <stop offset="100%" stop-color="#16294a"/>
  </linearGradient>
  <linearGradient id="skinM" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#a9754e"/>
    <stop offset="50%" stop-color="#cf9a6e"/>
    <stop offset="100%" stop-color="#a9754e"/>
  </linearGradient>
</defs>

<!-- tail / counterweight under the pivot -->
<path d="M34,211 C32,201 32,194 45,193 C58,194 58,201 56,211 Z" fill="url(#sleeveM)"/>

<!-- sleeve, tapering up from the pivot to the wrist -->
<path d="M12,196 C8,164 14,120 26,84 C30,72 36,64 45,62
         C54,64 57,74 53,86 C42,120 39,164 41,196 Z" fill="url(#sleeveM)"/>
<path d="M18,160 C16,134 20,104 27,86" stroke="#0e1c33" stroke-width="3" fill="none" opacity="0.5"/>
<path d="M36,150 C34,124 38,92 45,68" stroke="#3c5f8f" stroke-width="2.4" fill="none" opacity="0.55"/>

<!-- gold cuff -->
<path d="M36,74 C40,66 50,66 54,74 C50,80 40,80 36,74 Z" fill="#e3bd6a"/>

<!-- forearm + open blessing hand -->
<path d="M38,74 C36,60 37,46 40,34 L50,34 C53,46 54,60 52,74 Z" fill="url(#skinM)"/>

<!-- blessing gesture: index + middle raised together, ring finger curled to thumb, small finger raised -->
<path d="M40,36 C39,24 40,13 42,4 C43,1 47,1 48,4 C49,13 49,24 48,36 Z" fill="url(#skinM)"/>
<path d="M46,36 C45,25 46,15 48,7 C49,4 52,4 53,7 C55,15 55,25 53,36 Z" fill="url(#skinM)"/>
<path d="M53,37 C55,29 57,22 59,17 C60,15 63,16 63,18 C62,25 60,32 57,38 Z" fill="#c48f61"/>
<path d="M35,38 C33,32 33,27 35,23 C36,21 39,22 39,25 C39,30 38,34 37,39 Z" fill="#c48f61"/>
<!-- thumb touching ring finger -->
<path d="M35,42 C31,40 28,42 27,46 C26,49 29,51 32,49 C35,47 36,44 35,42 Z" fill="#c48f61"/>
</svg>
</body></html>
