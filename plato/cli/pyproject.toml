[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plato-cli"
version = "0.1.0"
description = "PLATO terminal client: run and watch multi-agent AI teams from PowerShell, Terminal, or any shell."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "websockets>=13"]
classifiers = [
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
plato = "plato_cli.main:main"

[tool.setuptools]
packages = ["plato_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
