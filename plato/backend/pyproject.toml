[project]
name = "plato-backend"
version = "0.1.0"
description = "PLATO — multi-AI agent operating system (API + orchestrator)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.isort]
# Explicit so results are identical whether ruff runs from backend/, plato/, or the repo root (CI).
known-first-party = ["app", "plato_cli"]
