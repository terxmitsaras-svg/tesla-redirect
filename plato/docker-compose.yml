# Local development stack: Postgres + Redis + API + web.
#   cp .env.example .env   # then fill in secrets
#   docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plato
      POSTGRES_PASSWORD: plato
      POSTGRES_DB: plato
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plato"]
      interval: 3s
      retries: 20
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
    ports: ["6379:6379"]

  api:
    build: ./backend
    env_file: .env
    environment:
      PLATO_DATABASE_URL: postgresql+asyncpg://plato:plato@postgres:5432/plato
      PLATO_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
