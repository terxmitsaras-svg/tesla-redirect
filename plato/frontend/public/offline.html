<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020306">
  <title>PLATO · Offline</title>
  <style>
    html, body { margin: 0; height: 100%; background: #020306; color: #e8f1ff;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 16px; text-align: center; box-sizing: border-box; }
    img { width: 112px; height: 112px; border-radius: 50%; box-shadow: 0 0 24px -6px rgba(94,231,255,.6); }
    h1 { font-weight: 300; letter-spacing: .42em; margin: 24px 0 8px; }
    p { color: #8a98ad; max-width: 360px; line-height: 1.5; }
    button { margin-top: 16px; background: rgba(61,139,255,.15); color: #e8f1ff; border: 1px solid rgba(61,139,255,.5);
      border-radius: 8px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/plato-mark.png" alt="">
    <h1>PLATO</h1>
    <p>You're offline. PLATO needs a connection to your PLATO server to run agents. Your history is safe on the server.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
